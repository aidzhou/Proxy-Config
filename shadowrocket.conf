# Final routing
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT
FINAL,PROXY

[Host]
localhost = 127.0.0.1
# Static bootstrap IPs for the DoH servers used above, so encrypted DNS does not
# depend on resolving its own hostname first
doh.pub = 1.12.12.12
dns.alidns.com = 223.5.5.5
dns.google = 8.8.8.8
cloudflare-dns.com = 1.1.1.1

[MITM]
enable = false
